# ==============================================================================
# Zensical 配置（官方 `zensical new` 模板风格）
# 文档：https://zensical.org/docs/setup/basics/
#
# TOML 顺序规则（很重要）：
#   [project] 的直属键 → [project.xxx] 子表 → 更深的子表。
#   一旦写了子表，就再也不能回头给父表加键；写错位置不会报错，只会静默失效。
# ==============================================================================

# ------------------------------------------------------------------------------
# 基础信息
# ------------------------------------------------------------------------------
[project]
site_name = "HuJi Notes"
site_url = "https://hujiko02.github.io/"
site_author = "HuJi"
site_description = "HuJi Notes —— 胡济的个人网站，记录教程、日记与笔记"

repo_url = "https://github.com/Hujiko02/Hujiko02.github.io"
repo_name = "Hujiko02/Hujiko02.github.io"

nav = [
    { "首页" = "index.md" },
    { "教程" = [
        "tutorial/index.md",
        "tutorial/markdown.md",
        "tutorial/markdown_test.md",
        "tutorial/latex.md",
        "tutorial/matplotlib.md",
        "tutorial/verilog.md",
        "tutorial/pico.md",
    ] },
    { "日记" = [
        "diary/index.md",
        "diary/2026.md",
    ] },
    { "关于我" = [
        "me/index.md",
    ] },
]

# 路径相对于 docs_dir
extra_css = [
    # KaTeX 自托管（版本/来源/升级步骤见 docs/others/katex/VENDOR.txt）：
    # 样式表留在 head 里同步加载，避免公式页先闪一下未渲染的 $...$
    "others/katex/katex.min.css",
    "others/stylesheets/extra.css",
]

extra_javascript = [
    # 只有这一个入口；katex.min.js / auto-render.min.js 由它检测到公式后才注入
    "others/javascripts/katex.js",
]

# ------------------------------------------------------------------------------
# 主题
# ------------------------------------------------------------------------------
[project.theme]
# variant = "modern"   # modern 是默认值，官方模板里就注释掉了；classic = 老 Material 外观
language = "zh"
custom_dir = "overrides"              # overrides/.icons/ 放自定义图标
favicon = "others/images/favicon.svg"
font = false                          # 不加载 Google Fonts（字体由 extra.css 自托管）

# features 必须写在 [project.theme.icon] 和 [[project.theme.palette]] 之前，
# 否则 TOML 会把它塞进后面的子表，全部功能静默失效。
features = [
    "navigation.instant",        # 即时加载
    "navigation.tabs",           # 顶部标签栏
    "navigation.indexes",        # 分区标题可点击，index.md 当落地页
    "navigation.top",            # 返回顶部按钮
    "navigation.tracking",       # 地址栏跟随锚点
    "navigation.path",           # 面包屑导航
    "toc.follow",                # 右侧目录跟随高亮
    "content.code.copy",         # 代码块复制按钮
    "content.code.annotate",     # 代码块内标注
    "content.tooltips",          # 术语悬浮提示
    "search.highlight",          # 搜索高亮
]

# 页头图标：图标名（huji / lucide/* / fontawesome/*）写在这里；
# [project.theme] 下的 logo 只接受图片文件路径（如 assets/logo.png）
[project.theme.icon]
logo = "huji"                         # 内联 SVG，跟随明暗主题变色
repo = "fontawesome/brands/github"

# 两档调色板：默认浅色，点一下切深色（不加 media 就是官方文档里的「手动切换」写法）
[[project.theme.palette]]
scheme = "default"
toggle.icon = "material/weather-sunny"
toggle.name = "切换到深色模式"        # name = 点一下会切到哪，不是当前状态

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "material/weather-night"
toggle.name = "切换到浅色模式"

# ------------------------------------------------------------------------------
# 社交链接
# ------------------------------------------------------------------------------
[[project.extra.social]]
name = "我的GitHub"
icon = "fontawesome/brands/github"
link = "https://github.com/Hujiko02"

[[project.extra.social]]
name = "我的Bilibili"
icon = "fontawesome/brands/bilibili"
link = "https://space.bilibili.com/2058282898"

# ------------------------------------------------------------------------------
# Markdown 扩展
#
# 注意：Zensical 自带一套默认扩展，但只要你在这里写了 markdown_extensions，
# 默认集就被整体替换 → 需要用的必须全部显式声明。
# 官方默认集里有 pymdownx.betterem（smart_enable = "all"），
# 它按词边界判断强调，中文没空格 → **粗体** 会变成字面星号，所以这里不要加。
# ------------------------------------------------------------------------------
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}

# toc.slugify 必须写成子表（object + kwds），写成字符串会在构建时崩：
# RuntimeError: TypeError: 'str' object is not callable
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }

# pymdownx.* 在官方模板里统一写成「去掉前缀 + 分组」的形式
[project.markdown_extensions.pymdownx]
arithmatex = { generic = true }       # 数学公式（$...$ / $$...$$）
caret = {}                            # ^上标^
details = {}                          # 可折叠块
emoji = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }
highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
inlinehilite = {}                     # 行内代码高亮
keys = {}                             # ++ctrl+c++
mark = {}                             # ==高亮==
superfences = { custom_fences = [     # 代码块；Material 自带 mermaid，自动加载渲染
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
] }
tabbed = { alternate_style = true }   # 内容标签页
tasklist = { custom_checkbox = true } # 任务列表
tilde = {}                            # ~~删除线~~ 和 ~下标~
