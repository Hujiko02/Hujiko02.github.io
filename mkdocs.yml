site_name: 胡济的个人网站
site_url: https://hujiko02.github.io/
site_author: 胡济
site_description: 胡济的个人网站

theme:
  name: material
  language: zh
  custom_dir: overrides          # overrides/.icons/ 放自定义图标
  favicon: others/images/favicon.svg
  icon:
    logo: huji                   # 页头图标：内联 SVG，跟随明暗主题变色
  font: false                    # 不加载 Google Fonts（国内慢又常失败）

  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式      # toggle.name = 点一下会切到哪，不是当前状态
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式

  features:
    - navigation.instant         # 即时加载
    - navigation.tabs            # 顶部标签栏
    - navigation.indexes         # 分区标题可点击，index.md 当落地页
    - navigation.top             # 返回顶部按钮
    - navigation.tracking        # 地址栏跟随锚点
    - navigation.footer          # 页底上/下一篇
    - toc.follow                 # 右侧目录跟随高亮
    - content.code.copy          # 代码块复制按钮
    - content.code.annotate      # 代码块内标注
    - content.tooltips           # 术语悬浮提示
    - search.suggest             # 搜索联想
    - search.highlight           # 搜索高亮

nav:
  - 首页: index.md
  - 教程:
    - tutorial/index.md
    - tutorial/latex.md
    - tutorial/markdown.md
    - tutorial/markdown_test.md
    - tutorial/verilog.md
    - tutorial/matplotlib.md
  - 日记:
    - diary/index.md
    - diary/2026.md
  - 关于我:
    - me/index.md

not_in_nav: |                    # 有意不进导航，消掉构建提示
  /ohush-privacy.md

extra:
  social:
    - name: 我的GitHub
      icon: fontawesome/brands/github
      link: https://github.com/Hujiko02
    - name: 我的Bilibili
      icon: fontawesome/brands/bilibili
      link: https://space.bilibili.com/2058282898

markdown_extensions:
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition
  - attr_list
  - md_in_html
  - abbr
  - def_list
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid         # Material 自带 mermaid，会自动加载并渲染
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  #    不要加官方那行 pymdownx.betterem: smart_enable: all
  #    它按词边界判断强调，中文无空格 → **粗体** 会变成字面星号
  - pymdownx.caret               # ^上标^
  - pymdownx.tilde               # ~~删除线~~ ~下标~
  - pymdownx.mark                # ==高亮==
  - pymdownx.keys                # ++ctrl+c++
  - pymdownx.tabbed:
      alternate_style: true      # 内容标签页
  - pymdownx.details             # 可折叠块

# 数学公式
extra_javascript:
  - others/javascripts/katex.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/contrib/auto-render.min.js

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.css
  - others/stylesheets/extra.css
