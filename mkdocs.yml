site_name: 胡济的个人网站
site_url: https://hujiko02.github.io/
site_author: 胡济
site_description: 胡济的个人网站


repo_url: https://github.com/Hujiko02/Hujiko02.github.io
repo_name: Hujiko02/Hujiko02.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  # 允许用 overrides/.icons/ 放自定义图标（icon.logo 只能从这个命名空间取）
  custom_dir: overrides
  # 浏览器标签页图标：自带 prefers-color-scheme，深浅标签栏都看得见
  favicon: others/images/favicon.svg
  # 页头图标：用 icon.logo 会内联成 <svg>，fill="currentColor" 跟着明暗主题自动变色
  icon:
    logo: huji
  # 关闭 Google Fonts（fonts.googleapis.com 在国内又慢又常失败），回退到系统字体
  font: false
  palette:
    # 自动模式：跟随系统的昼夜设置
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 切换到浅色模式
    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        # toggle.name 的语义是「点一下会发生什么」，不是当前状态
        name: 切换到深色模式
    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换到系统偏好

  features:
    - navigation.instant # 即时页面加载
    - navigation.tabs # 顶部标签页导航
    - navigation.indexes # 让分区标题本身可点击（index.md 当分区概览页）
    - navigation.top # 返回顶部按钮
    - navigation.tracking # 地址栏跟随锚点
    - navigation.footer # 页面底部上/下一篇
    - toc.follow # 右侧目录跟随滚动高亮
    - content.code.copy # 代码块一键复制
    - content.code.annotate # 代码块内标注
    - content.tooltips # 缩写/术语悬浮提示
    - content.action.edit # 右上角「编辑此页」（依赖 repo_url + edit_uri）
    - content.action.view # 右上角「查看源码」
    - search.suggest # 搜索联想
    - search.highlight # 搜索结果高亮

nav:
  - 首页: index.md
  - 教程:
    - tutorial/index.md
    - tutorial/latex.md
    - tutorial/markdown.md
    - tutorial/markdown_test.md
    - tutorial/verilog.md
    - tutorial/matplotlib.md
  - 日记:
    - diary/index.md
    - diary/2026.md
  - 关于我:
    - me/index.md

# 显式声明「存在但有意不进导航」的页面，消掉构建时的 INFO 提示
not_in_nav: |
  /ohush-privacy.md

extra:
  social:
    - name: 我的GitHub
      icon: fontawesome/brands/github
      link: https://github.com/Hujiko02
    - name: 我的Bilibili
      icon: fontawesome/brands/bilibili
      link: https://space.bilibili.com/2058282898

# Markdown 扩展
markdown_extensions:
  - toc:
      permalink: true # 标题旁生成可复制的锚点链接
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition
  - attr_list
  - md_in_html # 在 HTML 块里写 Markdown（做卡片/网格布局要用）
  - abbr # 术语缩写，配合 content.tooltips 出悬浮提示
  - def_list # 定义列表
  - footnotes # 脚注
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      # Material 内置 mermaid：会自动按需加载 unpkg 上的 mermaid@11 并渲染，
      # 无需额外插件。注意它只在页面真的存在 mermaid 图时才会下载，
      # 所以不开 mermaid 的页面不受影响。
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  # 以下 6 个官方配置里都有，实测对中文文档零副作用
  # ⚠️ 但官方那行 `pymdownx.betterem: smart_enable: all` 千万别加：
  #    它用词边界启发式判断强调，中文词间无空格会导致 **粗体** 变成字面星号
  #    （实测同一段文字 <strong> 从 7 个掉到 2 个）
  - pymdownx.caret # ^上标^
  - pymdownx.tilde # ~~删除线~~ 和 ~下标~
  - pymdownx.mark # ==高亮==
  - pymdownx.keys # ++ctrl+alt+del++ 按键样式
  - pymdownx.tabbed:
      alternate_style: true # 内容标签页
  - pymdownx.details # 可折叠块

# 数学公式支持
extra_javascript:
  - others/javascripts/katex.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/contrib/auto-render.min.js

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.css
  - others/stylesheets/extra.css
