<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    浏览器标签页图标。
    标签栏颜色跟随「操作系统/浏览器」的明暗设置，而不是站点自己的切换按钮，
    所以这里用 prefers-color-scheme 判断，并给出不支持的浏览器也能用的兜底色：
      - 兜底 / 浅色标签栏：#4051b5（Material indigo，深浅标签栏上都看得见）
      - 深色标签栏：#a8b6ff（浅靛蓝）
  -->
  <style>
    path { fill: #4051b5 }
    @media (prefers-color-scheme: dark) { path { fill: #a8b6ff } }
  </style>
  <path d="M11.76 19c1.16 0 1.82-1 1.82-2.71 0-1.09-.08-2.41-.28-3.62L18 5h-2.72l-2.57 4.82-.16-.49C11.83 7.19 10.82 5 8.68 5 8 5 7.45 5.18 7 5.54 6 6.39 6 8 6 8.5h.91c.06-.44.3-1.67 1.34-1.67 1.75 0 2.55 3.17 3.15 5.59-.9 2.16-1.4 3.72-1.4 4.55 0 .98.56 2.03 1.76 2.03"/>
</svg>
